<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="formats" content="fbcover">
<title>Yes on 4A — Facebook Page cover</title>
<!--
  Facebook Page cover. Rendered at 1640x624 (2x) — Facebook shows it at
  820x312 on desktop and crops to a NARROWER CENTRE on mobile.

      python3 tools/render_social_cards.py facebook-cover

  The artwork is the campaign's own supplied header (organizer,
  2026-09-11) — branding/yes-on-4a/facebook-header.png. Note it carries
  NO tagline, unlike the other lockups. Nothing is added to it here;
  this master only positions it so no part is cropped on any screen.

  Two things dictate this layout:

  1. Verified on the live Page (2026-09-09, owner view): the profile
     picture sits BELOW the cover on desktop, not overlapping it — so a
     large reserved band at the bottom is just dead space. A modest
     reserve stays because other surfaces (and the mobile app) do
     overlap the lower-left, and it costs nothing.
  2. Mobile crops the sides. Everything meaningful stays inside the
     centre ~78% of the width.

  The .safe box below encodes both. Nothing outside it is load-bearing.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#90CA65;--green-deep:#4E7B2C;--ink:#323F49;--ink-soft:#5A6772;--paper:#FBFAF7}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1640px;height:624px;background:var(--paper);overflow:hidden;
     font-family:'Source Sans Pro',system-ui,sans-serif;
     border-top:14px solid var(--green);
     display:flex;justify-content:center}
/* Mobile-safe width, and the bottom third reserved for the avatar. */
/* Artwork is placed by WIDTH inside the mobile-safe centre, never
   scaled to fill: the supplied lockup is aspect ~3.02 and the cover is
   2.63, so fitting by height would push the ends off the sides. The
   bottom margin is larger than the top because the mobile app floats
   the profile picture over the cover's lower centre even though
   desktop does not. */
.safe{width:100%;height:100%;
      padding:0 0 91px;
      display:flex;align-items:center;justify-content:center}
/* Sized by WIDTH. An earlier version also set max-height, which made
   height the binding constraint and shrank the logo to 53% of the
   canvas while 385px of margin sat unused on each side. The supplied
   PNG carries its own transparent padding (ink is ~95% of its width,
   72% of its height), so the visible ink lands near 69% of the cover
   width — inside the mobile-safe centre with ~160px clear at the
   bottom for the mobile profile picture. */
.lockup{width:70%;height:auto}
</style></head>
<body>
  <div class="safe">
    <img class="lockup" src="../yes-on-4a/facebook-header.png" alt="">
  </div>
</body></html>
