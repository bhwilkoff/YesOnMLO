<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="formats" content="fbcover">
<title>Yes on 4A — Facebook Page cover</title>
<!--
  Facebook Page cover. Rendered at 1640x624 (2x) — Facebook shows it at
  820x312 on desktop and crops to a NARROWER CENTRE on mobile.

      python3 tools/render_social_cards.py facebook-cover

  Two things dictate this layout, and the previous cover lost to both:

  1. Verified on the live Page (2026-09-09, owner view): the profile
     picture sits BELOW the cover on desktop, not overlapping it — so a
     large reserved band at the bottom is just dead space. A modest
     reserve stays because other surfaces (and the mobile app) do
     overlap the lower-left, and it costs nothing.
  2. Mobile crops the sides. Everything meaningful stays inside the
     centre ~78% of the width.

  The .safe box below encodes both. Nothing outside it is load-bearing.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#90CA65;--green-deep:#4E7B2C;--ink:#323F49;--ink-soft:#5A6772;--paper:#FBFAF7}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1640px;height:624px;background:var(--paper);overflow:hidden;
     font-family:'Source Sans Pro',system-ui,sans-serif;
     border-top:14px solid var(--green);
     display:flex;justify-content:center}
/* Mobile-safe width, and the bottom third reserved for the avatar. */
.safe{width:78%;height:100%;padding-bottom:70px;
      display:flex;flex-direction:column;align-items:center;justify-content:center}
.lockup{height:212px;width:auto}
.tag{margin-top:22px;font-weight:700;font-size:30px;letter-spacing:.13em;
     text-transform:uppercase;color:var(--green-deep);
     background:rgba(144,202,101,.32);padding:8px 20px;text-align:center}
</style></head>
<body>
  <div class="safe">
    <img class="lockup" src="../../assets/yes-on-4a-logo.png" alt="">
    <p class="tag">Littleton Public Schools &middot; November 3, 2026</p>
  </div>
</body></html>
